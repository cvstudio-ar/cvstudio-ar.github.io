  <rect x="-9" y="-2" width="18" height="151" rx="8" fill="#94652F" stroke-width="4"/>
  <rect x="-75" y="-43" width="150" height="73" rx="14" fill="#352819" stroke-width="7"/>
  <path d="M-62-36V22M62-36V22" stroke-width="8"/>
  <ellipse cx="0" cy="157" rx="80" ry="11" fill="#091624" stroke-width="5"/>
</g>
<path d="M96 76h86M96 91h55" stroke="#DBB475" stroke-width="3" stroke-opacity=".65" stroke-linecap="round"/>
<path d="M10 10H1014V670H10Z" fill="none" stroke="#C59B5B" stroke-opacity=".18" stroke-width="2"/>
<rect y="604" width="1024" height="76" fill="#081827" opacity=".42"/>
</svg>