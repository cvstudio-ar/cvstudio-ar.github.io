  <path d="M22 107L65 93l52-55h143l73 62 43 6c21 2 33 19 35 38v22H5v-31c0-11 6-22 17-28Z" fill="url(#metal)" fill-opacity=".3" stroke-width="4"/>
  <path d="M117 40L94 96h102V40M211 40v56h110l-68-56Z" fill="#6D8A9F" fill-opacity=".11" stroke-width="3"/>
  <circle cx="93" cy="162" r="33" fill="#0C2133" stroke="#A0B8C8" stroke-width="6"/>
  <circle cx="302" cy="162" r="33" fill="#0C2133" stroke="#A0B8C8" stroke-width="6"/>
  <path d="M345 116h31M18 129H5" stroke="url(#gold)" stroke-width="6"/>
</g>
<g transform="translate(442 390) scale(.72)" stroke="#8099AA" stroke-opacity=".38" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M15 90h35l57-60h143l70 60h55q20 0 23 21v39H0v-37q0-20 15-23Z" fill="#1B3548" stroke-width="5"/>
  <path d="M107 32L80 89h118V32M211 32v57h100" stroke-width="4"/>
  <circle cx="85" cy="147" r="28" fill="#0C2133" stroke-width="6"/><circle cx="303" cy="147" r="28" fill="#0C2133" stroke-width="6"/>
</g>
<!-- Gran balanza jurídica -->
<g transform="translate(753 295)" filter="url(#shadow)" stroke="url(#gold)" stroke-linejoin="round" stroke-linecap="round">
  <path d="M0-178V178" stroke-width="13"/>
  <path d="M-179-110C-115-129 99-129 179-110" fill="none" stroke-width="12"/>
  <path d="M0-186l-16 18h32Z" fill="url(#gold)" stroke-width="3"/>
  <circle cx="0" cy="-119" r="15" fill="url(#gold)" stroke-width="3"/>
  <path d="M-150-114l-68 152M-150-114l66 152M150-114l-68 152M150-114l66 152" stroke-width="4"/>
  <path d="M-225 40C-219 75-184 91-151 91s67-16 74-51Z" fill="#876032" fill-opacity=".72" stroke-width="5"/>
  <path d="M76 40c9 34 39 51 74 51s64-17 75-51Z" fill="#876032" fill-opacity=".72" stroke-width="5"/>
  <path d="M-22 178h44M-48 197h96M-82 211H82" stroke-width="10"/>
</g>
