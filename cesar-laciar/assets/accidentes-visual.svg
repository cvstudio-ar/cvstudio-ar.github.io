<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 680" role="img" aria-labelledby="visualTitle visualDesc">
<title id="visualTitle">Justicia y accidentes de tránsito</title>
<desc id="visualDesc">Composición azul nocturno y dorado con balanza jurídica, vehículos y elementos de la justicia.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#061624"/><stop offset=".53" stop-color="#15334B"/><stop offset="1" stop-color="#091B2C"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#D6AD67" stop-opacity=".35"/><stop offset=".48" stop-color="#D6AD67" stop-opacity=".12"/><stop offset="1" stop-color="#D6AD67" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FFF0C7"/><stop offset=".3" stop-color="#C79A50"/><stop offset=".6" stop-color="#F1CB8D"/><stop offset="1" stop-color="#8A5C2A"/></linearGradient>
  <linearGradient id="metal" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#8AA4B6"/><stop offset=".5" stop-color="#334B61"/><stop offset="1" stop-color="#182F46"/></linearGradient>
  <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2A4559" stop-opacity=".55"/><stop offset="1" stop-color="#071724"/></linearGradient>
  <pattern id="mesh" patternUnits="userSpaceOnUse" width="42" height="42"><path d="M42 0H0V42" fill="none" stroke="#D8E5EC" stroke-opacity=".038" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1024" height="680" fill="url(#bg)"/>
<rect width="1024" height="680" fill="url(#mesh)"/>
<ellipse cx="760" cy="270" rx="430" ry="380" fill="url(#light)"/>
<path d="M0 560C245 500 445 530 645 480S900 490 1024 450V680H0Z" fill="url(#ground)" opacity=".7"/>
<path d="M-70 584C280 500 395 544 1094 432" fill="none" stroke="#E6C089" stroke-opacity=".16" stroke-width="3" stroke-dasharray="28 28"/>
<path d="M-80 625C270 555 400 570 1090 478" fill="none" stroke="#A3BDC9" stroke-opacity=".12" stroke-width="2"/>
<!-- Siluetas de vehículos, como referencia vial abstracta -->
