name: Deploy CVStudio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate JavaScript
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './config/*' -not -path './_site/*' -print0 | xargs -0 -n1 node --check
          for file in config/*.js; do
            cp "$file" /tmp/cvstudio-worker-check.mjs
            node --check /tmp/cvstudio-worker-check.mjs
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Liberar despliegue de Pages bloqueado (solo esta recuperación)
        if: github.event.head_commit.message == 'Recuperar publicacion de GitHub Pages de CVStudio'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-cancel-response -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/bc9acd34e90ad9fe06cf099f0b4ccd86f5e31e5a/cancel")
          echo "Resultado cancelación Pages: HTTP $code"
          if [[ "$code" != "204" && "$code" != "404" ]]; then
            cat /tmp/pages-cancel-response
            exit 1
          fi

      - name: Prepare public site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'supabase/' \
            --exclude 'config/' \
            --exclude 'WORKER_CVSTUDIO_CONTACTO_ESTABLE.js' \
            --exclude 'js/siac-loader 1.js' \
            --exclude '.env.example' \
            --exclude 'centro-operaciones-prueba/panel-*.html' \
            --exclude '*.sql' \
            --exclude '*.zip' \
            ./ _site/

      - name: Verify private sources stay unpublished
        shell: bash
        run: |
          test ! -e _site/WORKER_CVSTUDIO_CONTACTO_ESTABLE.js
          test ! -e _site/centro-operaciones-prueba/panel-20260806-1208.html
          test ! -e "_site/js/siac-loader 1.js"

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
