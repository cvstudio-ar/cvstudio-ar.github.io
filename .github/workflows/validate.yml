name: Validate CVStudio

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["codex/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate JavaScript
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './config/*' -not -path './_site/*' -print0 | xargs -0 -n1 node --check
          for file in config/*.js; do
            cp "$file" /tmp/cvstudio-worker-check.mjs
            node --check /tmp/cvstudio-worker-check.mjs
          done

      - name: Block accidental credential leaks
        run: node scripts/scan-secrets.cjs

      - name: Verify internal sources are excluded from GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          # Files may exist in the repository but must never be published.
          grep -Fq -- "--exclude 'WORKER_CVSTUDIO_CONTACTO_ESTABLE.js'" .github/workflows/pages.yml
          grep -Fq -- "--exclude 'centro-operaciones-prueba/panel-*.html'" .github/workflows/pages.yml
          grep -Fq -- "--exclude 'js/siac-loader 1.js'" .github/workflows/pages.yml
          # Regression checks: production publication must reject sensitive files.
          grep -Fq -- "--exclude '.env'" .github/workflows/pages.yml
          grep -Fq -- "--exclude '.env.*'" .github/workflows/pages.yml
          grep -Fq -- "--exclude '.dev.vars'" .github/workflows/pages.yml
          grep -Fq -- "--exclude '*.pem'" .github/workflows/pages.yml
          grep -Fq -- "--exclude '*.key'" .github/workflows/pages.yml
          grep -Fq -- "if: github.actor == 'cvstudio-ar' && github.ref == 'refs/heads/main'" .github/workflows/pages.yml
          grep -Fq -- "BLOCKED: sensitive file pattern" .github/workflows/pages.yml
