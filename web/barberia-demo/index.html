<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Modelo demostrativo de espacio web para barberías, diseñado por CVStudio Argentina.">
  <meta property="og:title" content="Barbería | Modelo demostrativo de CVStudio">
  <meta property="og:description" content="Una muestra de cómo puede verse el sitio de tu barbería en computadora y celular.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://cvstudio.com.ar/web/barberia-demo/assets/barberia-hero.webp">
  <title>Barbería | Modelo demostrativo · CVStudio Argentina</title>
  <link rel="icon" href="assets/cvstudio-logo.webp" type="image/webp">
  <link rel="preload" href="assets/barberia-hero.webp" as="image">
  <link rel="stylesheet" href="styles.css"><script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <header class="site-header" id="inicio"><div class="wrap header-inner">
    <div class="brand" aria-label="Modelo demostrativo de CVStudio Argentina">
      <img src="assets/cvstudio-logo.webp" alt="CVStudio Argentina" width="44" height="44">
      <span class="brand-line" aria-hidden="true"></span><span class="demo-label">MODELO<br>DEMOSTRATIVO</span>
    </div>
    <span class="header-mark">BARBERÍA <i aria-hidden="true"></i> ESTILO PERSONAL</span>
  </div></header>
  <main id="contenido"><section class="showcase" aria-labelledby="hero-title">
    <div class="showcase-photo" role="img" aria-label="Barbero trabajando en un corte de cabello"></div>
    <div class="wrap showcase-inner">
      <div class="hero-content">
        <span class="eyebrow"><span aria-hidden="true"></span> BARBERÍA · ESTILO · IDENTIDAD</span>
        <h1 id="hero-title">Tu estilo, en<br><em>buenas manos.</em></h1>
        <p>Cortes, barba y una experiencia pensada para vos.</p>
        <button class="button demo-action" type="button">Reservar turno <span aria-hidden="true">↗</span></button>
      </div>
      <div class="services" id="servicios" aria-labelledby="services-title">
        <div class="services-heading"><span>LO QUE HACEMOS</span><h2 id="services-title">Servicios con <em>personalidad.</em></h2></div>
        <div class="service-grid">
          <button class="service-card demo-action" type="button" aria-label="Ejemplo de corte clásico">
            <span class="service-image service-image-one" aria-hidden="true"></span>
            <span class="service-copy"><small>01 / SERVICIO</small><strong>Corte clásico</strong><span>Precisión en cada detalle.</span></span><span class="card-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="service-card demo-action" type="button" aria-label="Ejemplo de barba y perfilado">
            <span class="service-image service-image-two" aria-hidden="true"></span>
            <span class="service-copy"><small>02 / SERVICIO</small><strong>Barba y perfilado</strong><span>El toque para tu look.</span></span><span class="card-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="service-card demo-action" type="button" aria-label="Ejemplo de asesoramiento de estilo">
            <span class="service-image service-image-three" aria-hidden="true"></span>
            <span class="service-copy"><small>03 / SERVICIO</small><strong>Tu propio estilo</strong><span>Una imagen que habla de vos.</span></span><span class="card-arrow" aria-hidden="true">↗</span>
          </button>
        </div>
      </div>
    </div>
  </section></main>
  <footer class="footer" id="contacto"><div class="wrap footer-inner">
    <span class="footer-credit">DISEÑO DEMOSTRATIVO POR <strong>CVSTUDIO ARGENTINA</strong></span>
    <div class="social-icons" aria-hidden="true">
      <span class="social-icon" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg></span>
      <span class="social-icon social-facebook" title="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.9 21v-8.1h2.7l.4-3.2h-3.1V7.6c0-.9.3-1.5 1.6-1.5H17V3.3c-.3 0-1.2-.1-2.3-.1-2.4 0-4 1.5-4 4.2v2.3H8v3.2h2.7V21h3.2Z"/></svg></span>
      <span class="social-icon" title="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 11.9a8.4 8.4 0 0 1-12.6 7.3L3 20.5l1.3-4.6A8.4 8.4 0 1 1 20.4 11.9Z"/><path d="M8.6 8.1c-.5.6-.7 1.2-.3 2.1.9 2.1 2.5 3.9 4.8 4.9.8.3 1.4.2 2-.4l.7-1.1-2.1-1-1 1c-1.2-.5-2-1.4-2.7-2.6l.8-.9-1-2Z"/></svg></span>
    </div>
  </div></footer>
  <div class="demo-toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
