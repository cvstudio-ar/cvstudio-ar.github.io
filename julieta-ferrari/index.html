<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Julieta Ferrari · Portfolio profesional</title>
  <meta name="description" content="Portfolio profesional de Julieta Ferrari, fotógrafa y comunicadora digital.">
  <link rel="canonical" href="https://cvstudio.com.ar/julieta-ferrari/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/portfolio-client.css?v=1.4.13">
  <link rel="stylesheet" href="/css/portfolio-landing.css?v=1.4.13">
</head>
<body>
  <main id="publicPortfolioRoot"><div class="public-empty"><h1>Cargando portfolio…</h1></div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js?v=2.9.1"></script>
  <script src="/js/portfolio-julieta.js?v=1.4.13"></script>
  <script>
  (()=>{
    const root=document.getElementById('publicPortfolioRoot');
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
    const safeUrl=v=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};
    const icons={
      home:'<svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v11h14V10M9 21v-7h6v7"/></svg>',
      phone:'<svg viewBox="0 0 24 24"><path d="M7.2 3.5 10 8l-2 2.2c1.3 2.6 3.4 4.7 6 6l2.2-2 4.3 2.8c.5.3.7.9.5 1.4-.7 1.8-2.5 3-4.4 2.8C9.5 20.4 3.6 14.5 2.8 7.4 2.6 5.5 3.8 3.7 5.6 3c.6-.2 1.2 0 1.6.5Z"/></svg>',
      user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4.5 21c.5-5 3-7.5 7.5-7.5S19 16 19.5 21"/></svg>',
      briefcase:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>',
      folder:'<svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
      star:'<svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg>'
    };
    const portfolio={
      slug:'julieta-ferrari',
      full_name:'Julieta Ferrari',
      brand_name:'followdigital.juli',
      business_type:'Fotografía',
      whatsapp:'+54 9 3493 511052',
      settings:{colors:['#f5c84c','#050506','#f7f2ea'],instagram:'https://www.instagram.com/followdigital.juli/'}
    };
    const unavailable=(status)=>{
      document.title='Portfolio no disponible · CVStudio';
      root.innerHTML=`<div class="public-empty"><h1>Portfolio no disponible</h1><p>${status==='Eliminado'?'Este proyecto fue eliminado.':'Este portfolio se encuentra temporalmente desactivado.'}</p><a class="button" href="/">Volver a CVStudio</a></div>`;
    };
    const render=()=>{
      if(typeof window.renderJulietaPortfolio==='function') window.renderJulietaPortfolio(portfolio,{root,esc,safeUrl,icons});
      else unavailable('Pausado');
    };
    (async()=>{
      try{
        const client=window.cvstudioSupabase;
        if(!client){ render(); return; }
        const {data,error}=await client.from('cvstudio_ops_stage_meta').select('rules').eq('id','centro-operaciones-prueba').maybeSingle();
        if(error) throw error;
        const spaces=Array.isArray(data?.rules?.__urlSpaces)?data.rules.__urlSpaces:[];
        const control=spaces.find(item=>item.slug==='julieta-ferrari');
        const status=control?.status||'Publicado';
        if(['Borrador','Pausado','Oculto','Eliminado'].includes(status)||control?.deleted) unavailable(status);
        else render();
      }catch(error){
        console.error('[CVStudio] No se pudo verificar el estado público:',error);
        render();
      }
    })();
  })();
  </script>
</body>
</html>
