name: Validate CVStudio

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["codex/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate JavaScript
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './config/*' -not -path './_site/*' -print0 | xargs -0 -n1 node --check
          for file in config/*.js; do
            cp "$file" /tmp/cvstudio-worker-check.mjs
            node --check /tmp/cvstudio-worker-check.mjs
          done

      - name: Verify removed internal files
        shell: bash
        run: |
          test ! -e WORKER_CVSTUDIO_CONTACTO_ESTABLE.js
          test ! -e centro-operaciones-prueba/panel-20260806-1208.html
          test ! -e "js/siac-loader 1.js"
