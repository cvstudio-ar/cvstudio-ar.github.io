<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración | VISER</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="assets/logo.webp"></head><body class="admin-body"><header class="admin-header"><div class="nav wrap"><a class="brand" href="index.html"><img src="assets/logo.webp" alt="VISER"></a><a href="index.html">← Ver la web</a></div></header><main class="wrap admin-main"><div class="admin-top"><h1>Panel administrativo</h1><button id="logout" class="btn blue" hidden>Salir</button></div><p id="status" class="notice" role="status"></p>
<section id="login" class="panel login"><h2>Ingresar</h2><p class="muted">Administrá tu catálogo y la portada.</p><form id="login-form"><label>Correo de administrador<input name="email" type="email" autocomplete="username" value="info@viserint.com" required></label><br><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><div class="form-actions"><button class="btn blue">Ingresar</button></div></form></section>
<div id="dashboard" hidden><section class="panel"><div class="admin-top"><h2>Productos</h2><button id="new" class="btn blue">+ Agregar producto</button></div><div id="admin-list" class="admin-list"></div></section>
<section id="editor" class="panel" hidden><h2 id="editor-title">Editar producto</h2><form id="product-form"><input name="id" type="hidden"><input name="image" type="hidden"><div class="form-grid"><label class="full">Imagen<input name="file" type="file" accept="image/jpeg,image/png,image/webp"><span class="muted">JPG, PNG o WebP. Máximo 5 MB. Foto limpia del equipo.</span><img id="image-preview" class="preview-image" alt="Vista previa" hidden></label><label class="full">Título<input name="title" required maxlength="180"></label><label class="full">Descripción<textarea name="description" required maxlength="3000"></textarea></label><label>Precio<input name="price" type="number" min="0" step="0.01" placeholder="Vacío: Consultar precio"></label><label>Moneda<select name="currency"><option>ARS</option><option>USD</option></select></label><label>Stock<input name="stock" type="number" min="0" step="1" placeholder="Vacío: no mostrar cantidad"></label><label>Categoría<select name="category"><option>Grupos electrógenos</option><option>Herramientas</option><option>Accesorios</option></select></label><label>Orden<input name="sort_order" type="number" min="0" step="1" value="0"></label><label class="checkbox"><input name="published" type="checkbox" checked> Visible en la web</label></div><div class="form-actions"><button class="btn blue">Guardar cambios</button><button id="cancel" type="button" class="btn">Cancelar</button></div></form></section>
<section class="panel"><h2>Portada y contacto</h2><p class="muted">Los cambios se reflejan en la web pública.</p><form id="settings-form"><div class="form-grid"><label class="full">Imagen de portada<input name="hero" type="file" accept="image/jpeg,image/png,image/webp"></label><label>WhatsApp<input name="whatsapp" placeholder="Ejemplo: 5493811234567" required pattern="[+0-9 ()-]{8,25}"></label><label>Correo público<input name="email" type="email"></label><label>Instagram<input name="instagram" type="url" placeholder="https://www.instagram.com/..."></label><label>Facebook<input name="facebook" type="url" placeholder="https://www.facebook.com/..."></label></div><div class="form-actions"><button class="btn blue">Guardar portada y contacto</button></div></form></section><section class="panel"><h2>Cambiar contraseña</h2><form id="password-form"><div class="form-grid"><label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Repetir contraseña<input name="confirm" type="password" autocomplete="new-password" minlength="12" required></label></div><div class="form-actions"><button class="btn blue">Actualizar contraseña</button></div></form></section></div></main><script type="module" src="admin.js"></script></body></html>
