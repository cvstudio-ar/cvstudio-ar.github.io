<body>
  <main id="publicPortfolioRoot"><div class="public-empty"><h1>Cargando portfolio…</h1></div></main>
  <script src="/js/portfolio-eliana.js?v=2.4.7"></script>
  <script>
  (() => {
    'use strict';
    // Mantiene la URL pública limpia incluso cuando GitHub Pages llega por el archivo de respaldo.
    if (location.pathname.endsWith('/beauty-nails-by-eliana.html') || location.pathname.endsWith('/beauty-nails-by-eliana/index.html')) {
      history.replaceState({}, '', '/beauty-nails-by-eliana/' + location.hash);
    }
    const root = document.getElementById('publicPortfolioRoot');
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]));
    const icons = {
      home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v11h14V10M9 21v-7h6v7"/></svg>',
      user:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4.5 21c.5-5 3-7.5 7.5-7.5S19 16 19.5 21"/></svg>',
      star:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg>',
      phone:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 3.5 10 8l-2 2.2c1.3 2.6 3.4 4.7 6 6l2.2-2 4.3 2.8c.5.3.7.9.5 1.4-.7 1.8-2.5 3-4.4 2.8C9.5 20.4 3.6 14.5 2.8 7.4 2.6 5.5 3.8 3.7 5.6 3c.6-.2 1.2 0 1.6.5Z"/></svg>'
    };
    if (typeof window.renderElianaPortfolio === 'function') {
      window.renderElianaPortfolio({brand_name:'Beauty Nails by Eliana'}, {root, esc, icons});
    } else {
      root.innerHTML = '<div class="public-empty"><h1>No se pudo cargar el portfolio</h1><p>Actualizá la página para volver a intentarlo.</p></div>';
    }
  })();
  </script>
</body>
</html>
