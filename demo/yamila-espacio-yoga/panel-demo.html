case 'resumen':return `<div class="admin-hero"><div><strong>Bienvenida al panel de Espacio Yoga ♡</strong><p>Desde aquí podés mantener los contenidos de tu web, sin tocar código.</p></div>${ic('flower')}</div><div class="admin-cards"><div class="stat"><strong>${content.services.filter(s=>s.visible).length}</strong><span>Propuestas visibles</span></div><div class="stat"><strong>${content.classes.filter(s=>s.visible).length}</strong><span>Clases publicadas</span></div><div class="stat"><strong>${Object.values(content.sections).filter(Boolean).length}</strong><span>Secciones activas</span></div></div>${panel('Qué podés modificar','Toda la web se administra desde el menú superior o lateral.',`<div class="content-preview"><button class="ghost-btn" data-tab="inicio">Editar portada ${ic('arrow')}</button><button class="ghost-btn" data-tab="servicios">Gestionar clases ${ic('arrow')}</button><button class="ghost-btn" data-tab="diseno">Cambiar imágenes ${ic('arrow')}</button><button class="ghost-btn" data-tab="contacto">Cambiar contacto ${ic('arrow')}</button></div>`)}<div class="admin-notice">${previewOnly?'Estás usando una vista previa local. Los cambios se guardan únicamente en este navegador y no se publican para otras personas.':'Los cambios se publican en la web al guardarlos. Para comprobarlos, abrí una ventana privada.'}</div>`;
case 'inicio':return panel('Portada principal','Título, introducción y bienvenida que ven los visitantes.',`<div class="fields">${field('identity.name','Nombre del espacio')}${field('identity.claim','Lema bajo el logo')}${field('identity.heroEyebrow','Etiqueta sobre el título')}${field('identity.heroTitle','Título de portada',{type:'textarea',rows:3,full:true,help:'Usá Enter para indicar exactamente dónde querés el salto de línea.'})}${field('identity.heroText','Texto debajo del título',{type:'textarea',full:true})}</div>`)+panel('Presentación de Yamila','Textos de la sección de presentación.',`<div class="fields">${field('identity.aboutTitle','Título de presentación')}${field('identity.introTitle','Lema secundario')}${field('identity.aboutText','Sobre el espacio / Yamila',{type:'textarea',full:true})}${field('identity.introText','Texto para el pie de página',{type:'textarea',full:true})}${field('identity.signoff','Frase destacada',{full:true})}${field('identity.benefitTitle','Título de beneficios',{full:true})}</div>`);
case 'servicios':return panel('Propuestas de yoga','Agregá, editá, reordená, ocultá o quitá propuestas. No se muestran las ocultas.',`<div class="admin-table">${[...content.services].sort((a,b)=>(a.order||0)-(b.order||0)).map(z=>`<div class="admin-item"><div class="admin-item-top"><strong>${x(z.name)}</strong><div class="admin-actions">${itemToggle('services',z.id,'visible','Visible')}<button class="ghost-btn danger" data-delete="services|${x(z.id)}">Eliminar</button></div></div><div class="fields">${itemField('services',z.id,'name','Nombre')}${itemField('services',z.id,'label','Subtítulo breve')}${itemField('services',z.id,'description','Descripción',{type:'textarea',full:true})}${itemField('services',z.id,'mode','Modalidad')}${itemField('services',z.id,'order','Orden de presentación')}${itemImageField('services',z.id)}</div></div>`).join('')}<button class="button small" data-add="services">+ Agregar servicio</button></div>`);
case 'clases':return panel('Horarios y propuestas','Creá las clases disponibles. Dejá los datos que aún no estén confirmados en blanco.',`<div class="admin-table">${[...content.classes].sort((a,b)=>(a.order||0)-(b.order||0)).map(z=>`<div class="admin-item"><div class="admin-item-top"><strong>${x(z.title)}</strong><div class="admin-actions">${itemToggle('classes',z.id,'visible','Publicar')}<button class="ghost-btn danger" data-delete="classes|${x(z.id)}">Eliminar</button></div></div><div class="fields">${itemField('classes',z.id,'title','Nombre de clase')}${itemField('classes',z.id,'mode','Modalidad: Online / Presencial')}${itemField('classes',z.id,'duration','Duración')}${itemField('classes',z.id,'frequency','Frecuencia')}${itemField('classes',z.id,'days','Días')}${itemField('classes',z.id,'time','Horarios')}${itemField('classes',z.id,'price','Precio o A consultar')}${itemField('classes',z.id,'order','Orden')}${itemField('classes',z.id,'notes','Información adicional',{type:'textarea',full:true})}</div></div>`).join('')}<button class="button small" data-add="classes">+ Agregar clase</button></div>`);
case 'promocion':return panel('Promoción de clases online','La promoción inicial proviene del folleto enviado. Podés cambiar su texto, valor y visibilidad cuando quieras.',`<div style="margin-bottom:24px">${toggle('identity.featuredVisible','Mostrar promoción de clases online')}</div><div class="fields">${field('identity.featuredTitle','Título de promoción',{full:true})}${field('identity.featuredText','Texto principal',{type:'textarea',full:true})}${field('identity.featuredSchedule','Días, frecuencia y turnos',{full:true})}${field('identity.featuredPrice','Precio (solo números)')}${field('identity.featuredCurrency','Moneda (ARS)')}${field('identity.featuredPriceNote','Nota de precio y vigencia',{full:true})}</div>`);
case 'diseno':return panel('Paleta visual','El logo oficial se conserva. Elegí una variante armónica para la web.',`<div class="preset-grid">${[['lavanda','Lavanda original','linear-gradient(100deg,#5d3467 32%,#718668 34%,#e8d9e5 67%,#fcfaf5 69%)'],['salvia','Verde salvia','linear-gradient(100deg,#4b6956 32%,#92759e 34%,#e2ece2 67%,#fcfaf5 69%)'],['arena','Arena natural','linear-gradient(100deg,#80664c 32%,#838d69 34%,#f0e3d2 67%,#fcfaf5 69%)']].map(([key,label,bg])=>`<button class="preset ${content.design.palette===key?'selected':''}" data-palette="${key}"><div class="swatch" style="background:${bg}"></div><strong>${label}</strong></button>`).join('')}</div>`)+panel('Imágenes del sitio','Podés cambiar el logo, la portada, la foto de presentación y el folleto. Los archivos aceptados son JPG, PNG, WEBP o AVIF (máximo 5 MB).',`<div class="fields">${imageField('design.logo','Logo oficial')}${imageField('design.heroImage','Imagen principal (si se carga reemplaza la ilustración)')}${imageField('design.aboutImage','Foto de presentación')}${imageField('design.flyerImage','Folleto/promoción')}</div>`);
case 'contacto':return panel('WhatsApp y redes','Los iconos de redes sociales sólo aparecen cuando tengan un enlace válido.',`<div class="fields">${field('contact.whatsapp','Teléfono de WhatsApp',{help:'Ejemplo: 1168711268. No agregar + ni espacios.'})}${field('contact.email','Correo electrónico',{type:'email'})}${field('contact.instagram','Enlace completo de Instagram',{placeholder:'https://instagram.com/...'})}${field('contact.facebook','Enlace completo de Facebook',{placeholder:'https://facebook.com/...'})}${field('contact.address','Dirección presencial (opcional)')}${field('contact.mapUrl','Enlace de Google Maps',{placeholder:'https://maps.google.com/...'})}${field('contact.locationText','Texto alternativo de ubicación',{full:true})}${field('contact.whatsappText','Mensaje predeterminado de WhatsApp',{type:'textarea',full:true})}</div>`);
case 'preguntas':return panel('Preguntas frecuentes','Respondé consultas habituales sin necesitar actualizar código.',`<div class="admin-table">${content.faqs.map((q,index)=>`<div class="admin-item"><div class="admin-item-top"><strong>Pregunta ${index+1}</strong><button class="ghost-btn danger" data-delete-index="faqs|${index}">Eliminar</button></div><div class="fields"><div class="field full"><label>Pregunta</label><input data-index-collection="faqs" data-index="${index}" data-key="question" value="${x(q.question)}"></div><div class="field full"><label>Respuesta</label><textarea rows="3" data-index-collection="faqs" data-index="${index}" data-key="answer">${x(q.answer)}</textarea></div></div></div>`).join('')}<button class="button small" data-add="faqs">+ Agregar pregunta</button></div>`);
case 'seo':return panel('Datos para buscadores','Título y descripción de la página; la indexación definitiva dependerá del dominio y su alta en Google.',`<div class="fields">${field('seo.title','Título SEO',{full:true})}${field('seo.description','Descripción SEO',{type:'textarea',full:true})}</div>`)+panel('Visibilidad de secciones','Podés ocultar las partes que todavía no quieras mostrar.',`<div class="fields">${[['services','Propuestas'],['modalities','Modalidades'],['about','Sobre Yamila'],['featured','Promoción'],['benefits','Beneficios'],['schedules','Clases y horarios'],['faq','Preguntas frecuentes']].map(([key,label])=>`<div>${toggle('sections.'+key,label)}</div>`).join('')}</div>`);
}}
function adminPage(){document.body.className='admin-body';document.documentElement.dataset.palette=content.design.palette||'lavanda';if(!adminAllowed&&!previewOnly){app.innerHTML=adminHeader()+(configured?`<div class="login-wrap"><div class="login-card"><img class="login-logo" src="assets/emblema-yoga.webp" alt="Espacio Yoga"><div class="eyebrow">ACCESO RESTRINGIDO</div><h1>Bienvenida al espacio.</h1><p>Ingresá con tu correo y contraseña de administración para actualizar tu web.</p><form id="login-form"><div class="field"><label>Correo electrónico</label><input name="email" type="email" autocomplete="username" required placeholder="tu-correo@ejemplo.com"></div><div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></div><button class="button" type="submit">Ingresar ${ic('arrow')}</button>${loginError?`<p class="error" role="alert">${x(loginError)}</p>`:''}</form><p style="margin-top:23px"><a href="/demo/yamila-espacio-yoga/">← Volver al sitio</a></p></div></div>`:`<div class="login-wrap"><div class="login-card"><img class="login-logo" src="assets/emblema-yoga.webp" alt="Espacio Yoga"><h1>Panel en preparación.</h1><p>La estructura administrativa está lista, pero todavía no se vinculó una base de datos propia de Yamila. Para activar el acceso seguro, seguí el README del proyecto.</p><div class="admin-notice">Este panel no utiliza las cuentas de CVStudio ni de otros clientes.</div><a href="/demo/yamila-espacio-yoga/" class="button secondary">Volver al inicio ${ic('arrow')}</a></div></div>`);document.querySelector('#login-form')?.addEventListener('submit',login);return}
app.innerHTML=adminHeader()+`<div class="admin-layout"><aside class="admin-sidebar"><div class="sidebar-heading">CONTENIDOS</div>${tabs.map(([id,label,icon])=>`<button class="${adminTab===id?'active':''}" data-tab="${id}">${ic(icon)} ${label}</button>`).join('')}${adminAllowed?`<div class="sidebar-heading">CUENTA</div><button id="logout">${ic('logOut')} Cerrar sesión</button>`:''}</aside><main class="admin-content"><div class="admin-head"><div><h1>${x(tabs.find(z=>z[0]===adminTab)?.[1]||'Resumen')}</h1><p>Administrá tu espacio con total libertad.</p></div><a class="button small secondary" target="_blank" rel="noopener" href="/demo/yamila-espacio-yoga/?preview=1">${ic('eye')} Ver sitio</a></div>${previewOnly?`<div class="admin-message warn">Modo local de prueba: las modificaciones se guardan sólo en este navegador y no son visibles para otros usuarios.</div>`:''}${notice?`<div class="admin-message" role="status">${x(notice)}</div>`:''}${adminBody()}<div class="admin-save-bar"><span class="save-status" id="save-status">${dirty?'Tenés cambios sin guardar':'Cambios listos para guardar'}</span><button class="button small" id="save-content">${ic('check')} Guardar cambios</button></div></main></div>`;
}
function markDirty(){dirty=true;const el=document.querySelector('#save-status');if(el)el.textContent='Tenés cambios sin guardar'}
function setPath(path,value){const keys=path.split('.');let ptr=content;for(const key of keys.slice(0,-1))ptr=ptr[key];ptr[keys.at(-1)]=value;markDirty()}
function newId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()}
async function saveContent(){const btn=document.querySelector('#save-content');if(btn)btn.disabled=true;try{if(previewOnly){localStorage.setItem(localKey,JSON.stringify(content));dirty=false;notice='Cambios guardados en este navegador. Para revisarlos, abrí «Vista previa de cambios». La web pública no se modifica.'}else{const {error}=await db.from('yoga_content').upsert({id:1,data:content},{onConflict:'id'});if(error)throw error;dirty=false;notice='Cambios publicados correctamente. La web ya puede mostrar la actualización.'}adminPage()}catch(e){notice=`No se pudo guardar: ${e.message||'Error de red'}`;adminPage()}finally{if(btn)btn.disabled=false}}
async function uploadImage(file,path,item){if(!file)return;if(!['image/jpeg','image/png','image/webp','image/avif'].includes(file.type)){notice='Formato no admitido. Usá JPG, PNG, WEBP o AVIF.';adminPage();return}if(file.size>5*1024*1024){notice='La imagen supera el máximo de 5 MB.';adminPage();return}let url='';try{if(previewOnly){url=URL.createObjectURL(file);notice='Imagen cargada sólo para vista previa. Para guardar imágenes de manera permanente, conectá Supabase.'}else{const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const filename=`public/${newId()}.${ext}`;const {error}=await db.storage.from('yoga-media').upload(filename,file,{contentType:file.type,upsert:false});if(error)throw error;const {data}=db.storage.from('yoga-media').getPublicUrl(filename);url=data.publicUrl;notice='Imagen subida. Presioná Guardar cambios para publicarla.'}if(item){const [collection,id]=item.split('|');const obj=content[collection].find(z=>z.id===id);if(obj)obj.image=url}else setPath(path,url);markDirty();adminPage()}catch(e){notice='Error al subir la imagen: '+(e.message||'Error de conexión');adminPage()}}
async function login(e){e.preventDefault();const fd=new FormData(e.currentTarget);loginError='';const button=e.currentTarget.querySelector('button');button.disabled=true;button.textContent='Verificando...';try{const {error}=await db.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});if(error)throw error;const {data,error:accessError}=await db.from('yoga_admins').select('user_id').limit(1);if(accessError||!data?.length){await db.auth.signOut();throw new Error('Tu cuenta no tiene autorización administrativa.')}adminAllowed=true;const {data:row}=await db.from('yoga_content').select('data').eq('id',1).maybeSingle();if(row?.data)content=mergeData(defaults,row.data);adminPage()}catch(error){loginError=error.message||'No se pudo iniciar sesión';adminPage()}}
async function init(){if(localMode){const stored=localStorage.getItem(localKey);if(stored){try{content=mergeData(defaults,JSON.parse(stored))}catch{}}}if(configured){try{const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.57.0');db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);if(isAdmin){const {data:{session}}=await db.auth.getSession();if(session){const {data}=await db.from('yoga_admins').select('user_id').limit(1);adminAllowed=!!data?.length}if(adminAllowed){const {data}=await db.from('yoga_content').select('data').eq('id',1).maybeSingle();if(data?.data)content=mergeData(defaults,data.data)}}else{const {data}=await db.from('yoga_content').select('data').eq('id',1).maybeSingle();if(data?.data)content=mergeData(defaults,data.data)}}catch(error){console.warn('Conexión de contenidos no disponible',error.message||error)}}if(isAdmin){previewOnly=localMode&&!configured;adminPage()}else publicPage()}

document.addEventListener('input',e=>{const t=e.target;if(!isAdmin||(!adminAllowed&&!previewOnly))return;if(t.dataset.field){setPath(t.dataset.field,t.type==='checkbox'?t.checked:t.value)}else if(t.dataset.item){const obj=content[t.dataset.item]?.find(z=>z.id===t.dataset.id);if(obj){obj[t.dataset.key]=t.type==='checkbox'?t.checked:t.value;markDirty()}}else if(t.dataset.indexCollection){const row=content[t.dataset.indexCollection]?.[+t.dataset.index];if(row){row[t.dataset.key]=t.value;markDirty()}}});
document.addEventListener('change',async e=>{const t=e.target;if(!isAdmin||(!adminAllowed&&!previewOnly))return;if(t.matches('[data-upload]'))await uploadImage(t.files?.[0],t.dataset.upload,null);if(t.matches('[data-upload-item]'))await uploadImage(t.files?.[0],null,t.dataset.uploadItem)});
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||!isAdmin||(!adminAllowed&&!previewOnly))return;if(t.dataset.tab){adminTab=t.dataset.tab;notice='';adminPage();window.scrollTo({top:0,behavior:'instant'})}else if(t.dataset.palette){content.design.palette=t.dataset.palette;markDirty();adminPage()}else if(t.dataset.add){const collection=t.dataset.add;if(collection==='services')content.services.push({id:newId(),name:'Nueva propuesta',label:'',description:'',mode:'A consultar',image:'',visible:false,order:content.services.length+1});if(collection==='classes')content.classes.push({id:newId(),title:'Nueva clase',mode:'Online',duration:'',frequency:'',days:'',time:'',price:'A consultar',notes:'',visible:false,order:content.classes.length+1});if(collection==='faqs')content.faqs.push({question:'Nueva pregunta',answer:''});markDirty();adminPage()}else if(t.dataset.delete){const [coll,id]=t.dataset.delete.split('|');if(confirm('¿Querés quitar este contenido?')){content[coll]=content[coll].filter(z=>z.id!==id);markDirty();adminPage()}}else if(t.dataset.deleteIndex){const [coll,index]=t.dataset.deleteIndex.split('|');if(confirm('¿Querés quitar esta pregunta?')){content[coll].splice(+index,1);markDirty();adminPage()}}else if(t.dataset.removeImage){setPath(t.dataset.removeImage,'');adminPage()}else if(t.dataset.removeItemImage){const [coll,id]=t.dataset.removeItemImage.split('|');const obj=content[coll]?.find(z=>z.id===id);if(obj)obj.image='';markDirty();adminPage()}else if(t.id==='save-content'){await saveContent()}else if(t.id==='logout'){await db.auth.signOut();adminAllowed=false;content=clone(defaults);adminPage()}});

init();
</script>
</body>
</html>
