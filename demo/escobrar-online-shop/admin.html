<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel administrativo | Escobar Online Shop</title>
<style>
:root{--navy:#0b1630;--blue:#395cf6;--surface:#fff;--bg:#f3f6fd;--ink:#1a2945;--muted:#6b7890;--line:#e5ebf5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #adc6ff}a{color:inherit;text-decoration:none}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}.side{background:var(--navy);color:#d9e2f7;padding:25px 17px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;font-weight:900;font-size:19px;padding:8px 10px 28px}.brand i{border-radius:13px;background:linear-gradient(130deg,#b0ff42,#466afa);font-style:normal;color:#081328;padding:10px}.navitem{display:flex;align-items:center;gap:13px;border:0;border-radius:12px;background:transparent;color:#c4d0ea;padding:14px 15px;width:100%;text-align:left;font-weight:700;margin-bottom:6px}.navitem.active,.navitem:hover{background:#31456f;color:white}.sidebottom{margin-top:auto;border-top:1px solid #35435d;padding-top:17px}.main{min-width:0}.top{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px}.top strong{font-size:20px}.top span{color:var(--muted);font-size:13px}.content{padding:28px 32px;max-width:1800px;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}.pagehead h1{font-size:28px;letter-spacing:-.9px;margin:0 0 5px}.sub{margin:0;color:var(--muted);font-size:14px}.btn{border:none;border-radius:10px;padding:11px 16px;font-weight:750;background:#ecf1fb;color:#243756}.btn.primary{background:var(--blue);color:#fff}.btn.danger{background:#fff0f1;color:#b12845}.btn.sm{font-size:12px;padding:8px 10px}.btn:hover{filter:brightness(.96)}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 6px 22px #13234d08;margin-bottom:20px}.card h2{font-size:18px;margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat{padding:22px;border:1px solid var(--line);border-radius:16px;background:#fff}.stat span{font-size:13px;color:var(--muted)}.stat b{display:block;font-size:31px;margin-top:8px;color:#142951}.actions{display:flex;gap:10px;flex-wrap:wrap}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.field{width:100%;min-width:0;display:grid;gap:7px;color:#35435d;font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe3f1;border-radius:10px;background:#fff;color:#172a48;padding:12px;min-height:45px;font-weight:500}.field textarea{min-height:96px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.wide{grid-column:1/-1}.formactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:860px;text-align:left}.table th{background:#f5f7fc;color:#62738f;font-size:12px;padding:13px}.table td{border-bottom:1px solid var(--line);padding:13px;font-size:13px}.table tr:last-child td{border:0}.thumb{height:53px;width:53px;border-radius:9px;object-fit:cover;background:linear-gradient(140deg,#24456c,#6e8cb0);flex-shrink:0}.productname{display:flex;gap:10px;align-items:center}.productname b{display:block}.productname small{display:block;color:var(--muted);margin-top:4px}.tag{background:#eef3ff;color:#2a4db5;border-radius:8px;padding:5px 9px;font-size:11px;font-weight:750}.tag.off{background:#fff1e6;color:#a95522}.upload{border:2px dashed #aac0e8;border-radius:14px;background:#f7faff;padding:20px;display:grid;gap:11px;place-items:center;text-align:center;cursor:pointer;min-height:170px}.upload img{width:180px;max-height:160px;object-fit:contain;border-radius:10px}.upload input{display:none}.muted{color:var(--muted);font-size:13px}.notice{background:#fff8e7;border:1px solid #f4e2b6;padding:13px 16px;border-radius:12px;color:#76551f;font-size:13px;margin-bottom:18px}.loginpage{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 0%,#243a72,#0b1630 65%);padding:25px}.loginbox{background:white;border-radius:24px;padding:37px;width:min(440px,100%);box-shadow:0 30px 90px #0005}.loginbox h1{font-size:26px;margin:0 0 7px}.loginbox form{display:grid;gap:17px;margin-top:25px}.loginerror{color:#bd2e40;font-size:13px}.empty{text-align:center;padding:50px 10px;color:var(--muted)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.log{padding:12px 0;border-bottom:1px solid var(--line)}.log:last-child{border:0}
@media(max-width:930px){.shell{grid-template-columns:75px 1fr}.side{padding:20px 8px}.brand{font-size:0;padding:8px 4px 20px}.brand i{font-size:20px}.navitem{font-size:0;justify-content:center;padding:15px 4px}.navitem i{font-size:22px}.sidebottom .navitem{font-size:0}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:20px}.top{padding:0 20px}}
@media(max-width:620px){.shell{display:block}.side{height:auto;position:relative;display:flex;flex-direction:row;flex-wrap:wrap;gap:4px;padding:9px}.brand{font-size:0;padding:5px}.navitem,.sidebottom .navitem{width:auto;padding:10px;font-size:0;margin:0}.navitem i{font-size:19px}.sidebottom{margin:0;padding:0;border:0}.top{height:auto;padding:16px}.top strong{font-size:16px}.content{padding:15px}.pagehead h1{font-size:23px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{gap:9px}.stat{padding:15px}}
</style></head><body><div id="app"></div>
<script>
(function(){
"use strict";
const KEY="cvstudio.escobar.demo.v1", SESSION="escobar-admin-demo-session";
const names=[["Lattafa Fakhar","Perfumes","Eau de Parfum masculino · 100 ml"],["Afnan Supremacy Collector’s Edition","Perfumes","Edición especial"],["Rasasi Hawas Kobra","Perfumes","100 ml"],["Rasasi Hawas Ice","Perfumes","100 ml"],["Afnan 9PM Elixir","Perfumes","100 ml"],["Armaf Odyssey Mega","Perfumes","Masculino"],["Armaf Club de Nuit Urban Elixir","Perfumes","Masculino"],["Afnan 9PM Night Out","Perfumes","Masculino"],["Armaf Club de Nuit Iconic","Perfumes","105 ml"],["Lattafa Asad EDP","Perfumes","Masculino"],["Maison Alhambra Philos Pura","Perfumes","Unisex"],["Medicube Deep Vita C Capsule Cream","Skincare","Crema facial"],["Medicube Zero Pore Pad","Skincare","70 discos"],["Medicube PDRN Pink Collagen Capsule Cream","Skincare","55 g"]];
const defaults=names.map((x,i)=>({id:i+1,name:x[0],category:x[1],detail:x[2],price:0,wholesale:0,stock:0,active:true}));
let data={catalog:defaults,orders:[],settings:{whatsapp:"",shipping:"Por coordinar",minimum:10}};
try{let saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&Array.isArray(saved.catalog))data={...data,...saved}}catch(e){}
let page="Inicio",editing=null,query="",filter="Todos";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n)>0?new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n):"Consultar";
const photo=p=>p.image||"assets/producto-"+String(p.id).padStart(2,"0")+".webp";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("El almacenamiento del navegador está lleno. Probá subir una imagen más liviana o exportar un respaldo.");return false}};
const auth=()=>sessionStorage.getItem(SESSION)==="yes";
function login(){document.getElementById("app").innerHTML='<div class="loginpage"><section class="loginbox"><h1>Escobar Online Shop</h1><p class="sub">Acceso al panel administrativo de demostración</p><form id="loginForm"><label class="field">Usuario<input id="user" required autocomplete="username" placeholder="Usuario"></label><label class="field">Contraseña<input id="pass" type="password" autocomplete="current-password" required placeholder="Contraseña"></label><div class="loginerror" id="err"></div><button class="btn primary">Ingresar al panel</button><a class="btn" style="text-align:center" href="index.html">Volver a la tienda</a></form><p class="muted" style="margin-top:22px">Demo: Admin / EscobarDemo26<br>Los datos se almacenan solamente en este navegador. No utilizar información real.</p></section></div>';$("#loginForm").onsubmit=e=>{e.preventDefault();if($("#user").value.trim()==="Admin"&&$("#pass").value==="EscobarDemo26"){sessionStorage.setItem(SESSION,"yes");page="Inicio";draw()}else $("#err").textContent="Usuario o contraseña de demostración incorrectos."}}
function shell(body){$("#app").innerHTML='<div class="shell"><aside class="side"><div class="brand"><i>E</i>ESCOBAR SHOP</div>'+[["Inicio","⌂"],["Productos","▦"],["Pedidos","▤"],["Configuración","⚙"],["Respaldos","⇩"]].map(([n,i])=>'<button class="navitem '+(page===n?"active":"")+'" data-page="'+n+'"><i>'+i+'</i>'+n+'</button>').join("")+'<div class="sidebottom"><a class="navitem" href="index.html"><i>↗</i> Ver tienda</a><button class="navitem" id="logout"><i>⇥</i> Cerrar sesión</button></div></aside><section class="main"><div class="top"><strong>Administración <span> / '+esc(page)+'</span></strong><div class="row"><span>Modo demostración · Local</span><button class="btn sm" id="logoutTop">Cerrar sesión</button></div></div><main class="content">'+body+'</main></section></div>';document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;editing=null;draw()});$("#logout").onclick=$("#logoutTop").onclick=()=>{sessionStorage.removeItem(SESSION);login()}}
function heading(title,description,buttons=""){return '<div class="pagehead"><div><h1>'+title+'</h1><p class="sub">'+description+'</p></div><div class="actions">'+buttons+'</div></div>'}
function dashboard(){let c=data.catalog,o=data.orders;let body=heading("Resumen general","Gestioná tu tienda desde un mismo lugar.",'<button class="btn primary" id="newProduct">+ Agregar producto</button>')+'<div class="notice">Panel de prueba. Los cambios se reflejan en el catálogo del mismo navegador. No se cobran pagos reales ni se sincronizan datos entre dispositivos.</div><div class="stats">'+[["Productos",c.length],["Publicados",c.filter(p=>p.active).length],["Pedidos de prueba",o.length],["Sin stock",c.filter(p=>!p.stock).length]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("")+'</div><div class="card" style="margin-top:20px"><h2>Accesos rápidos</h2><div class="actions"><button class="btn" data-go="Productos">Administrar catálogo</button><button class="btn" data-go="Pedidos">Ver pedidos</button><button class="btn" data-go="Configuración">Configuración comercial</button><button class="btn" data-go="Respaldos">Exportar respaldo</button></div></div>';
shell(body);$("#newProduct").onclick=()=>editor("new");document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;draw()})}
function products(){let shown=data.catalog.filter(p=>(filter==="Todos"||p.category===filter)&&(!query||(p.name+" "+p.category).toLowerCase().includes(query)));let body=heading("Catálogo de productos","Administrá fotografías, productos, inventario y precios.",'<button class="btn primary" id="newProduct">+ Agregar producto</button>')+'<div class="card"><div class="filters"><input id="search" placeholder="Buscar producto o marca..." style="flex:1;min-width:190px;border:1px solid #dbe3f1;border-radius:10px;padding:11px" value="'+esc(query)+'"><select id="filter" class="btn"><option>Todos</option><option '+(filter==="Perfumes"?"selected":"")+'>Perfumes</option><option '+(filter==="Skincare"?"selected":"")+'>Skincare</option><option '+(filter==="Accesorios"?"selected":"")+'>Accesorios</option></select><span class="muted">'+shown.length+' resultados</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Producto</th><th>Minorista</th><th>Mayorista</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'+shown.map(p=>'<tr><td><div class="productname"><img class="thumb" src="'+esc(photo(p))+'" onerror="this.style.opacity=.25" alt=""><div><b>'+esc(p.name)+'</b><small>'+esc(p.category)+' · '+esc(p.detail)+'</small></div></div></td><td>'+fmt(p.price)+'</td><td>'+fmt(p.wholesale)+'</td><td>'+p.stock+'</td><td><span class="tag '+(!p.active?"off":"")+'">'+(p.active?"Visible":"Oculto")+'</span></td><td><div class="row"><button class="btn sm" data-edit="'+p.id+'">Editar</button><button class="btn sm" data-toggle="'+p.id+'">'+(p.active?"Ocultar":"Mostrar")+'</button><button class="btn sm danger" data-remove="'+p.id+'">Eliminar</button></div></td></tr>').join("")+'</tbody></table></div></div>';
shell(body);$("#newProduct").onclick=()=>editor("new");$("#search").oninput=e=>{query=e.target.value;products();$("#search").focus();$("#search").setSelectionRange(query.length,query.length)};$("#filter").onchange=e=>{filter=e.target.value;products()};document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editor(b.dataset.edit));document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let p=data.catalog.find(p=>p.id==b.dataset.toggle);p.active=!p.active;save();products()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{if(confirm("¿Eliminar este producto de la demo?")){data.catalog=data.catalog.filter(p=>p.id!=b.dataset.remove);save();products()}})}
function editor(id){editing=id;let p=id==="new"?{name:"",category:"Perfumes",detail:"",description:"",price:0,wholesale:0,stock:0,active:true,image:""}:data.catalog.find(p=>p.id==id);if(!p)return products();let body=heading(id==="new"?"Nuevo producto":"Editar producto","Completá los datos y subí una fotografía desde tu dispositivo.",'<button class="btn" id="back">← Volver al catálogo</button>')+'<div class="card"><h2>Fotografía principal</h2><label class="upload" for="imageFile"><img id="preview" src="'+esc(p.image||"")+'" alt="Vista previa" style="'+(!p.image?"display:none":"")+'"><span id="uploadText">'+(p.image?"Cambiar fotografía":"📷 Elegir o arrastrar una imagen de producto")+'</span><span class="muted">JPG, PNG o WebP · optimización automática para la demo</span><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn sm" id="clearImage" style="margin-top:10px">Quitar imagen cargada</button></div><div class="card"><h2>Información comercial</h2><form id="productForm"><div class="formgrid"><label class="field">Nombre del producto *<input id="pName" required maxlength="120" value="'+esc(p.name)+'"></label><label class="field">Categoría<select id="pCat">'+["Perfumes","Skincare","Accesorios"].map(c=>'<option '+(p.category===c?"selected":"")+'>'+c+'</option>').join("")+'</select></label><label class="field wide">Presentación / tamaño<input id="pDetail" maxlength="160" value="'+esc(p.detail)+'" placeholder="Ej.: Eau de Parfum · 100 ml"></label><label class="field wide">Descripción detallada<textarea id="pDescription" placeholder="Descripción, notas, beneficios u otras características">'+esc(p.description||"")+'</textarea></label><label class="field">Precio minorista (ARS)<input id="pPrice" type="number" min="0" value="'+Number(p.price||0)+'"></label><label class="field">Precio mayorista (ARS)<input id="pWholesale" type="number" min="0" value="'+Number(p.wholesale||0)+'"></label><label class="field">Stock disponible<input id="pStock" type="number" min="0" step="1" value="'+Number(p.stock||0)+'"></label><label class="field">Visibilidad<select id="pActive"><option value="yes" '+(p.active?"selected":"")+'>Publicado</option><option value="no" '+(!p.active?"selected":"")+'>Oculto</option></select></label></div><div class="formactions"><button class="btn primary" type="submit">Guardar producto</button><button class="btn" type="button" id="cancel">Cancelar</button></div></form></div>';
shell(body);$("#back").onclick=$("#cancel").onclick=()=>{page="Productos";editing=null;draw()};let imageValue=p.image||"";$("#imageFile").onchange=async e=>{let file=e.target.files[0];if(!file)return;if(!file.type.startsWith("image/"))return alert("Seleccioná una imagen válida.");try{imageValue=await compress(file);$("#preview").src=imageValue;$("#preview").style.display="block";$("#uploadText").textContent="Fotografía lista para guardar";}catch(err){alert("No se pudo procesar la imagen.")}};$("#clearImage").onclick=()=>{imageValue="";$("#preview").style.display="none";$("#uploadText").textContent="Elegir imagen"};$("#productForm").onsubmit=e=>{e.preventDefault();let n=$("#pName").value.trim(),stock=Number($("#pStock").value);if(!n||!Number.isInteger(stock)||stock<0)return alert("Completá un nombre y stock válido.");let updated={...p,id:id==="new"?Math.max(0,...data.catalog.map(x=>x.id))+1:p.id,name:n,category:$("#pCat").value,detail:$("#pDetail").value,description:$("#pDescription").value,price:Math.max(0,Number($("#pPrice").value)||0),wholesale:Math.max(0,Number($("#pWholesale").value)||0),stock,active:$("#pActive").value==="yes",image:imageValue};if(id==="new")data.catalog.unshift(updated);else data.catalog=data.catalog.map(x=>x.id===updated.id?updated:x);if(save()){page="Productos";editing=null;draw()}}}
function compress(file){return new Promise((resolve,reject)=>{let r=new FileReader;r.onerror=reject;r.onload=()=>{let img=new Image;img.onerror=reject;img.onload=()=>{let max=850,scale=Math.min(1,max/Math.max(img.width,img.height));let c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/webp",.70))};img.src=r.result};r.readAsDataURL(file)})}
function orders(){let body=heading("Pedidos de prueba","Consultá y actualizá los pedidos simulados de esta tienda.")+'<div class="card"><h2>Historial de pedidos</h2>'+(data.orders.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Pedido</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead><tbody>'+data.orders.map(o=>'<tr><td>'+esc(o.id)+'</td><td>'+esc(o.date||"")+'</td><td>'+fmt(o.total)+'</td><td><select data-order="'+esc(o.id)+'">'+["Nuevo","Preparando","Enviado","Finalizado","Cancelado"].map(st=>'<option '+(o.status===st?"selected":"")+'>'+st+'</option>').join("")+'</select></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">Todavía no hay pedidos de prueba. Podés simularlos desde la tienda.</div>')+'</div>';shell(body);document.querySelectorAll("[data-order]").forEach(el=>el.onchange=e=>{let o=data.orders.find(o=>o.id===el.dataset.order);if(o){o.status=e.target.value;save()}})}
function settings(){let s=data.settings||{};let body=heading("Configuración","Ajustes de contacto y condiciones comerciales.")+'<div class="card"><h2>Información de la tienda</h2><form id="settingsForm"><div class="formgrid"><label class="field">WhatsApp de atención<input id="wa" value="'+esc(s.whatsapp||"")+'" placeholder="Número con código de país"></label><label class="field">Compra mínima mayorista (unidades)<input id="minimum" type="number" min="1" value="'+Number(s.minimum||10)+'"></label><label class="field wide">Envíos / entregas<input id="shipping" value="'+esc(s.shipping||"")+'" placeholder="Modalidades de entrega"></label></div><div class="formactions"><button class="btn primary">Guardar configuración</button></div></form></div>';shell(body);$("#settingsForm").onsubmit=e=>{e.preventDefault();data.settings={...s,whatsapp:$("#wa").value.trim(),shipping:$("#shipping").value.trim(),minimum:Math.max(1,Number($("#minimum").value)||10)};if(save())alert("Configuración guardada para esta demo.")}}
function backups(){let body=heading("Respaldos y exportación","Descargá datos de prueba o reiniciá la demostración.")+'<div class="card"><h2>Herramientas de respaldo</h2><div class="actions"><button class="btn primary" id="json">Descargar respaldo JSON</button><button class="btn" id="csv">Exportar catálogo CSV</button><button class="btn danger" id="reset">Restablecer datos de prueba</button></div><p class="muted">Las imágenes cargadas desde el panel se incluyen en el respaldo JSON. Esta demo no ofrece almacenamiento en la nube ni autenticación de producción.</p></div>';shell(body);$("#json").onclick=()=>download("escobar-respaldo-demo.json",JSON.stringify(data,null,2),"application/json");$("#csv").onclick=()=>download("escobar-productos.csv","Nombre;Categoría;Precio minorista;Precio mayorista;Stock\n"+data.catalog.map(p=>[p.name,p.category,p.price,p.wholesale,p.stock].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(";")).join("\n"),"text/csv");$("#reset").onclick=()=>{if(confirm("¿Borrar cambios de prueba realizados en este navegador?")){data={catalog:structuredClone(defaults),orders:[],settings:{whatsapp:"",shipping:"Por coordinar",minimum:10}};save();draw()}}}
function download(name,text,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function draw(){if(!auth())return login();if(editing!==null)return editor(editing);({Inicio:dashboard,Productos:products,Pedidos:orders,"Configuración":settings,Respaldos:backups}[page]||dashboard)()}
window.addEventListener("storage",e=>{if(e.key===KEY){try{let v=JSON.parse(e.newValue);if(v&&Array.isArray(v.catalog)){data=v;if(auth()&&editing===null)draw()}}catch(err){}}});
draw();
})();
</script></body></html>
