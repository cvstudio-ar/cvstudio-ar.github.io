<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="cvstudio-build" content="1.4.35-bootstrap">
  <script>
  (()=>{
    const LOCAL_BUILD="20260806-1208";
    const key="cvstudio_bootstrap_reload";
    fetch(`./version.json?nocache=${Date.now()}`,{cache:"no-store",headers:{"Cache-Control":"no-cache"}})
      .then(r=>r.ok?r.json():null)
      .then(v=>{
        const remote=String(v&&v.build||"");
        if(!remote||remote===LOCAL_BUILD){sessionStorage.removeItem(key);return;}
        const attempts=Number(sessionStorage.getItem(key)||0);
        if(attempts>1)return;
        sessionStorage.setItem(key,String(attempts+1));
        const u=new URL(location.href);
        u.searchParams.set("cvbuild",remote);
        u.searchParams.set("reload",Date.now());
        location.replace(u.toString());
      }).catch(()=>{});
  })();
  </script>
<meta name="viewport" content="width=device-width,initial-scale=1">
